<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GymFlowPro — Call Sheet</title>
<meta name="description" content="Daily member follow-up and action queue.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="../pos/pos.css?v=theme1">
<link rel="stylesheet" href="call-sheet.css?v=theme1">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sb-hdr"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7ACC00"/><path d="M10 22L16 10L22 22" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 18H20" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/></svg><span>GymFlowPro</span></div>
<nav class="sb-nav"><a class="sb-item" href="/dashboard/"><i class="ti ti-layout-dashboard"></i>Dashboard</a></nav>
<div class="sb-ft"><div class="av-sm" id="userAvatar">U</div><div class="sb-ft-info"><div class="sb-ft-name" id="userName">User</div><div class="sb-ft-role" id="userRole">Staff</div></div><button class="sb-logout" id="btnLogout" title="Logout"><i class="ti ti-logout"></i></button></div>
</aside>

<div class="main">
<header class="topbar">
  <div class="tb-left"><div class="tb-breadcrumb"><span data-en="Front desk" data-ar="الاستقبال">Front desk</span><span class="sep">/</span><span class="current" data-en="Call Sheet" data-ar="ورقة المتابعة">Call Sheet</span></div></div>
  <div class="tb-right"><div class="gym-name" id="gymName">Gym</div></div>
</header>

<div class="content">
  <div class="page-header">
    <div>
      <h1 class="page-title" data-en="Call Sheet" data-ar="ورقة المتابعة">Call Sheet</h1>
      <p class="page-subtitle" data-en="Stay on top of today's member follow-ups." data-ar="تابع متابعات الأعضاء اليوم.">Stay on top of today's member follow-ups.</p>
    </div>
    <button type="button" class="btn primary" id="btnAdd"><i class="ti ti-plus"></i> <span data-en="Add Follow-up" data-ar="إضافة متابعة">Add Follow-up</span></button>
  </div>

  <div class="overdue-bar" id="overdueBar" hidden>
    <span id="overdueCopy"></span>
  </div>

  <div class="cs-toolbar">
    <div class="cs-chips" id="dateChips">
      <button type="button" class="chip act" data-date="today">Today</button>
      <button type="button" class="chip" data-date="tomorrow">Tomorrow</button>
      <button type="button" class="chip" data-date="upcoming">Upcoming</button>
      <button type="button" class="chip warn" data-date="overdue">Overdue</button>
      <button type="button" class="chip" data-date="all">All</button>
    </div>
    <div class="cs-search"><i class="ti ti-search"></i><input id="searchQ" type="search" placeholder="Name, phone, or member number" autocomplete="off"></div>
    <div class="cs-filter-wrap">
      <button type="button" class="btn" id="btnFilters"><i class="ti ti-filter"></i> Filters <span class="n" id="filterCount" hidden>0</span></button>
      <div class="cs-pop" id="filterPop" hidden>
        <h3>Filters</h3>
        <label>Status
          <select id="fltStatus">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In progress</option>
            <option value="contacted">Contacted</option>
            <option value="no_answer">No answer</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label>Reason
          <select id="fltReason">
            <option value="">All reasons</option>
            <option value="renewal">Renewal</option>
            <option value="trial">Trial</option>
            <option value="payment">Payment</option>
            <option value="welcome">Welcome</option>
            <option value="inactive">Inactive</option>
            <option value="offer">Offer</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label>Priority
          <select id="fltPriority">
            <option value="">All</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label>Assignee
          <select id="fltAssignee">
            <option value="">All staff</option>
            <option value="me">My follow-ups</option>
            <option value="unassigned">Unassigned</option>
          </select>
        </label>
        <div class="cs-pop-ft">
          <button type="button" class="btn ghost" id="btnFilterClear">Clear</button>
          <button type="button" class="btn primary" id="btnFilterApply">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cs-kpis" id="kpis"></div>
  <div id="queue"></div>
</div>
</div>
</div>

<div class="drawer-ov" id="drawerOv" hidden>
  <aside class="drawer" role="dialog" aria-labelledby="drawerTitle">
    <div class="drawer-hdr">
      <div>
        <h2 id="drawerTitle">Member</h2>
        <div class="drawer-id" id="drawerMeta"></div>
      </div>
      <button type="button" class="btn sm ghost" id="btnDrawerClose"><i class="ti ti-x"></i></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-ft" id="drawerFt"></div>
  </aside>
</div>

<div class="modal-ov" id="addOv" hidden>
  <div class="modal" role="dialog">
    <h3>Add follow-up</h3>
    <p class="hint">Search a member. Reason and due can stay as they are.</p>
    <label>Member</label>
    <div class="pick">
      <input id="addMemberQ" type="search" placeholder="Name, phone, or member number" autocomplete="off">
      <div id="addMemberResults" class="pick-results" hidden></div>
      <div id="addMemberSelected" class="pick-sel" hidden></div>
    </div>
    <label>Reason</label>
    <select id="addReason">
      <option value="custom">Custom</option>
      <option value="renewal">Renewal</option>
      <option value="trial">Trial</option>
      <option value="payment">Payment</option>
      <option value="welcome">Welcome</option>
      <option value="inactive">Inactive</option>
      <option value="offer">Offer</option>
    </select>
    <label>Priority</label>
    <select id="addPriority">
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="low">Low</option>
    </select>
    <label>Due</label>
    <input id="addDue" type="datetime-local">
    <label>Note (optional)</label>
    <textarea id="addNote" rows="2" maxlength="500"></textarea>
    <div class="modal-ft">
      <button type="button" class="btn ghost" id="btnAddCancel">Cancel</button>
      <button type="button" class="btn primary" id="btnAddSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="outOv" hidden>
  <div class="modal" role="dialog">
    <h3 id="outTitle">Log call</h3>
    <p class="hint" id="outHint"></p>
    <label>Call outcome</label>
    <div class="choice" id="outChoices"></div>
    <p class="hint">Outcome is history. Follow-up status stays a separate lifecycle.</p>
    <label>Note (optional)</label>
    <textarea id="outNote" rows="2" maxlength="300"></textarea>
    <label>Next action</label>
    <div class="choice" id="nextChoices"></div>
    <label>Follow-up at (if needed)</label>
    <input id="outNextAt" type="datetime-local">
    <div class="modal-ft">
      <button type="button" class="btn ghost" id="btnOutCancel">Cancel</button>
      <button type="button" class="btn primary" id="btnOutSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="call-sheet-app.js?v=fu1"></script>
</body>
</html>
