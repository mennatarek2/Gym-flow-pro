<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymFlowPro — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<!--
  Role-aware gym dashboard — permission-gated widgets, real APIs only.
  Hierarchy: Financial overview → Today → Quick Actions → Business overview → Operations → Needs attention.
  Expenses, profit, and margin are shown only when the cash-expense capability and permission exist.
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c900:#0D0D0D;--c800:#1A1A1A;--c700:#2A2A2A;--c600:#3A3A3A;--c500:#4A4A4A;
  --c400:#6B6B6B;--c300:#8C8C8C;--c200:#B0B0B0;--c100:#D4D4D4;--c50:#F0F0F0;
  --l600:#5EAF00;--l500:#7ACC00;--l400:#A0E040;--l300:#BEEC73;--l200:#D8F5A6;
  --l100:#EDFCD8;--lglow:rgba(160,224,64,0.25);
  --t700:#0A4D4D;--t600:#0D6B6B;--t500:#148F8F;--t400:#3DB5B5;
  --suc500:#22C55E;--suc100:#DCFCE7;
  --wrn500:#F59E0B;--wrn100:#FEF3C7;
  --dng500:#EF4444;--dng100:#FEE2E2;
  --inf500:#3B82F6;--inf100:#DBEAFE;
  --lbg:#FAFAFA;--ls1:#FFF;--ls2:#F5F5F5;--ls3:#EBEBEB;
  --ltp:#1A1A1A;--lts:#4A4A4A;--ltt:#8C8C8C;--lbd:#D4D4D4;
  --dtp:#F0F0F0;--dts:#B0B0B0;--dtt:#6B6B6B;--dbd:#4A4A4A;
  --fd:'Space Grotesk',sans-serif;--fb:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;
  --fa:'IBM Plex Sans Arabic',sans-serif;
  --rsm:6px;--rmd:10px;--rlg:16px;--rxl:24px;--rpl:9999px;
  --sh1:0 1px 2px rgba(0,0,0,.06);--sh2:0 2px 8px rgba(0,0,0,.08);
  --sh3:0 4px 16px rgba(0,0,0,.12);
  --tf:150ms ease;--tb:250ms ease;
  --sidebar-w:220px;
}
html,body{height:100%}
body{font-family:var(--fb);background:var(--lbg);color:var(--ltp);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir="rtl"] body{font-family:var(--fa)}
.app{display:flex;height:100vh}
.sidebar{
  width:var(--sidebar-w);background:var(--c900);color:var(--dtp);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;
  z-index:100;overflow-y:auto;overflow-x:hidden;
}
[dir="rtl"] .sidebar{left:auto;right:0}
.sb-hdr{padding:20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--c700)}
.sb-hdr svg{width:32px;height:32px;flex-shrink:0}
.sb-hdr span{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--l400);letter-spacing:-.3px}
.sb-nav{padding:8px 0;flex:1}
.sb-item{
  display:flex;align-items:center;gap:12px;padding:10px 20px;
  font-size:13px;font-weight:500;cursor:pointer;transition:all var(--tf);
  border-left:3px solid transparent;color:var(--c300);text-decoration:none;
}
.sb-item:hover{background:var(--c700)}
.sb-item.act{background:rgba(160,224,64,.08);color:var(--l400);border-left-color:var(--l500)}
.sb-item i{font-size:18px;opacity:.7;width:20px;text-align:center}
.sb-ft{padding:16px;border-top:1px solid var(--c700);display:flex;align-items:center;gap:12px}
.sb-ft-info{flex:1;min-width:0}
.sb-ft-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ft-role{font-size:11px;color:var(--c400)}
.sb-logout{background:none;border:none;color:var(--c400);cursor:pointer;font-size:18px;padding:4px}
.sb-logout:hover{color:var(--dng500)}
.av-sm{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:11px;flex-shrink:0;text-transform:uppercase;background:var(--l300);color:var(--c900)}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
[dir="rtl"] .main{margin-left:0;margin-right:var(--sidebar-w)}
.topbar{
  height:60px;background:var(--ls1);border-bottom:1px solid var(--ls3);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50;
}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-breadcrumb{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--lts)}
.tb-right{display:flex;align-items:center;gap:16px}
.tb-gym-name{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--lts)}
.tb-gym-name-ar{font-family:var(--fa);font-size:12px;color:var(--ltt);direction:rtl}
.content{padding:24px 32px;flex:1}
.dash-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.dash-eyebrow{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--l600)}
.dash-intro h1{font-family:var(--fd);font-size:28px;line-height:1.15;margin-top:4px}
.dash-intro p{font-size:14px;color:var(--ltt);margin-top:5px}
.dash-intro-meta{font-size:12px;color:var(--ltt);white-space:nowrap}

.widget-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:16px;
}
.dash-widget{
  grid-column:span 6;
  background:var(--ls1);border:1px solid var(--ls3);border-radius:var(--rlg);
  box-shadow:var(--sh1);padding:18px 20px;min-height:0;
  display:flex;flex-direction:column;gap:12px;
}
.dash-widget.span-12{grid-column:span 12}
.dash-widget.span-6{grid-column:span 6}
.dash-widget[data-widget="kpis"],
.dash-widget[data-widget="quick-actions"]{grid-column:span 12}
.dash-widget[data-widget="kpis"]{min-height:0;padding:16px 18px}
.dash-widget-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dash-widget-title{font-family:var(--fd);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.dash-widget-title i{color:var(--l600)}
.dash-widget-sub{font-size:12px;color:var(--ltt);margin-top:2px}
.dash-widget-body{flex:1;min-width:0}
.dash-section-label{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:6px 2px 0}
.dash-section-label span{font-family:var(--fd);font-size:15px;font-weight:800}
.dash-section-label small{font-size:12px;color:var(--ltt)}
.dash-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.dash-kpi-row.compact{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.dash-kpi{background:var(--ls2);border-radius:var(--rmd);padding:12px 14px;cursor:default}
.dash-kpi .lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--ltt);margin-bottom:4px}
.dash-kpi strong{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1.15;display:block}
.dash-kpi-row.compact .dash-kpi strong{font-size:18px}
.dash-kpi strong.ok{color:var(--suc500)}
.dash-kpi .sub{display:block;margin-top:4px;font-size:12px;color:var(--lts)}
.dash-exec-period{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dash-exec-period-label{font-size:13px;color:var(--ltt)}
.dash-exec-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.dash-exec-kpi{background:var(--ls2);border:1px solid var(--ls3);border-radius:var(--rlg);padding:14px 16px;min-height:108px;display:flex;flex-direction:column;gap:6px}
.dash-exec-kpi.is-warn{border-color:color-mix(in srgb,var(--wrn500) 45%,var(--ls3))}
.dash-exec-kpi.is-muted{opacity:.92}
.dash-exec-kpi .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.35px;color:var(--ltt)}
.dash-exec-kpi .val{font-family:var(--fd);font-size:24px;font-weight:800;line-height:1.1;color:var(--ltp)}
.dash-exec-kpi .val.unavailable{font-size:16px;font-weight:700;color:var(--ltt)}
.dash-exec-kpi .sub{font-size:12px;color:var(--lts);line-height:1.35}
.dash-exec-kpi .hint{display:block;margin-top:4px;font-size:11px;color:var(--ltt);line-height:1.45;font-style:normal}
.dash-exec-kpi .hint strong{color:var(--lts);font-weight:600}
.dash-exec-kpi .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ltt)}
.dash-exec-kpi .status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--suc500);flex-shrink:0}
.dash-exec-kpi .status.warn::before{background:var(--wrn500)}
.dash-exec-kpi .status.unavailable::before{background:var(--ltt)}
.dash-exec-section{margin-top:18px}
.dash-exec-section>h3{font-family:var(--fd);font-size:14px;font-weight:800;margin:0 0 10px}
.dash-exec-owed{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dash-exec-owed .dash-exec-kpi{min-height:96px}
.dash-exec-attn{display:flex;flex-direction:column;gap:8px}
.dash-exec-attn-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--rmd);border:1px solid color-mix(in srgb,var(--wrn500) 30%,var(--ls3));background:color-mix(in srgb,var(--wrn500) 8%,var(--ls2))}
.dash-exec-attn-item p{margin:4px 0 0;font-size:12px;color:var(--lts);line-height:1.4}
.dash-exec-attn-item strong{font-size:13px}
.dash-exec-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dash-exec-links a{font-size:12px;font-weight:700;color:var(--l600);text-decoration:none;padding:6px 10px;border-radius:var(--rmd);border:1px solid var(--ls3);background:var(--ls1)}
.dash-exec-links a:hover{border-color:var(--l500)}
.dash-exec-kpis-hero{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.dash-exec-kpi-cost .val{font-size:22px}
.dash-profit-bridge{display:flex;flex-direction:column;gap:0;border:1px solid var(--ls3);border-radius:var(--rmd);background:var(--ls1);overflow:hidden}
.dash-profit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--ls3);font-size:13px}
.dash-profit-row:last-child{border-bottom:0}
.dash-profit-row.is-total{background:var(--ls2);font-weight:700}
.dash-profit-row strong{font-family:var(--fd);font-size:14px}
.dash-exec-callout{margin:10px 0 0;padding:10px 12px;border-radius:var(--rmd);border:1px solid color-mix(in srgb,var(--wrn500) 35%,var(--ls3));background:color-mix(in srgb,var(--wrn500) 8%,var(--ls2));font-size:12px;color:var(--lts);line-height:1.45}
.dash-exec-glossary{margin:0 0 16px;padding:12px 14px;border:1px solid var(--ls3);border-radius:var(--rmd);background:var(--ls1)}
.dash-exec-glossary>summary{cursor:pointer;font-family:var(--fd);font-size:13px;font-weight:800;color:var(--ltp);list-style:none}
.dash-exec-glossary>summary::-webkit-details-marker{display:none}
.dash-exec-glossary>summary::before{content:'▸ ';color:var(--l600)}
.dash-exec-glossary[open]>summary::before{content:'▾ '}
.dash-exec-glossary-list{margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.dash-exec-glossary-list dt{font-size:12px;font-weight:700;color:var(--ltp)}
.dash-exec-glossary-list dd{margin:2px 0 0;font-size:12px;color:var(--lts);line-height:1.45}
.dash-exec-glossary-foot{margin:12px 0 0}
.dash-chart-note{margin-top:8px;font-size:12px;color:var(--ltt)}
.dash-muted{color:var(--ltt);font-size:13px}
.dash-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dash-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--fd);font-size:12px;font-weight:700;padding:8px 14px;
  border-radius:var(--rmd);border:1px solid var(--ls3);background:var(--ls2);
  color:var(--lts);text-decoration:none;cursor:pointer;
}
.dash-btn.primary{background:var(--l500);border-color:var(--l500);color:var(--c900)}
.dash-btn.secondary{background:var(--ls1);border:2px solid var(--ls3);color:var(--ltp)}
.dash-btn.secondary:hover{border-color:var(--l500)}
.dash-btn.ghost{background:transparent}
.dash-btn:disabled{opacity:.55;cursor:not-allowed}
.dash-list{list-style:none;display:flex;flex-direction:column;gap:0}
.dash-list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ls3);font-size:13px;flex-wrap:wrap}
.dash-list li:last-child{border-bottom:none}
.dash-list-main{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-list a.dash-list-main{color:inherit;text-decoration:none}
.dash-list a.dash-list-main:hover{color:var(--l600)}
.dash-list-meta{color:var(--ltt);font-size:12px;flex-shrink:0;font-family:var(--fd);white-space:nowrap}
.dash-exp-main{flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px}
.dash-exp-sub{font-size:12px;color:var(--ltt);font-weight:500}
.dash-exp-actions{display:flex;gap:8px;flex-shrink:0}
.dash-link{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--l600);text-decoration:none}
.dash-link:hover{text-decoration:underline}
.dash-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.dash-quick-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-height:112px;padding:22px 16px;border-radius:var(--rlg);
  border:1px solid var(--ls3);background:var(--ls2);text-decoration:none;color:var(--ltp);
  font-family:var(--fd);font-size:15px;font-weight:700;text-align:center;
  transition:border-color var(--tf),background var(--tf);
}
.dash-quick-item:hover{border-color:var(--l500);background:var(--l100)}
.dash-quick-ico{
  width:48px;height:48px;border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;
}
.dash-quick-ico i{font-size:24px;line-height:1}
.dash-quick-item.qa-member .dash-quick-ico{background:var(--inf100);color:var(--inf500)}
.dash-quick-item.qa-checkin .dash-quick-ico{background:var(--l100);color:var(--l600)}
.dash-quick-item.qa-sale .dash-quick-ico{background:var(--suc100);color:var(--suc500)}
.dash-quick-item.qa-collect .dash-quick-ico{background:var(--wrn100);color:var(--wrn500)}
.dash-quick-item.qa-trial .dash-quick-ico{background:var(--l100);color:var(--l600)}
.dash-quick-item.qa-remind .dash-quick-ico{background:var(--wrn100);color:var(--wrn500)}
.dash-quick-item.qa-shift .dash-quick-ico{background:var(--inf100);color:var(--inf500)}
.dash-quick-item.qa-close .dash-quick-ico{background:var(--dng100);color:var(--dng500)}
.dash-quick-item.qa-refund .dash-quick-ico{background:var(--dng100);color:var(--dng500)}
.dash-quick-item.qa-offer .dash-quick-ico{background:var(--suc100);color:var(--suc500)}
.dash-quick-item.qa-freeze .dash-quick-ico{background:var(--inf100);color:var(--inf500)}
.dash-quick-item.qa-class .dash-quick-ico{background:var(--l100);color:var(--l600)}
.dash-quick-item.qa-add{
  border-style:dashed;background:transparent;color:var(--lts);cursor:pointer;
}
.dash-quick-item.qa-add .dash-quick-ico{background:var(--ls3);color:var(--lts)}
.dash-quick-item.qa-add:hover{border-color:var(--l500);background:var(--l100)}
.dash-quick.is-saving{opacity:.55;pointer-events:none}
.dash-qa-tile{position:relative;min-width:0;display:flex}
.dash-qa-tile .dash-quick-item{width:100%;height:100%}
.dash-qa-remove{
  position:absolute;top:6px;inset-inline-end:6px;width:24px;height:24px;border:none;
  border-radius:var(--rpl);background:var(--ls1);color:var(--lts);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1);
  opacity:1;
}
@media(hover:hover){
  .dash-qa-remove{opacity:0}
  .dash-qa-tile:hover .dash-qa-remove,.dash-qa-remove:focus{opacity:1}
}
.dash-qa-remove:hover{background:var(--dng100);color:var(--dng500)}
.dash-qa-manage-link{
  background:none;border:none;cursor:pointer;padding:0;font-family:var(--fd);
  font-size:12px;font-weight:700;color:var(--l600);
}
.dash-qa-manage-link:hover{text-decoration:underline}
.dash-qa-manage-below{display:inline-block;margin-top:10px}
.dash-modal-overlay{
  position:fixed;inset:0;background:rgba(13,13,13,.45);display:flex;align-items:center;
  justify-content:center;z-index:400;padding:16px;
}
.dash-modal-overlay[hidden]{display:none}
.dash-modal{
  background:var(--ls1);border-radius:var(--rlg);width:100%;max-width:420px;max-height:min(80vh,640px);
  overflow:auto;box-shadow:var(--sh3);padding:18px 20px;
}
.dash-modal-wide{max-width:520px}
.dash-modal-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.dash-modal-hdr h3{font-family:var(--fd);font-size:16px;font-weight:700}
.dash-modal-close{
  width:32px;height:32px;border:none;border-radius:var(--rmd);background:var(--ls2);
  cursor:pointer;color:var(--lts);display:flex;align-items:center;justify-content:center;
}
.dash-qa-section{font-family:var(--fd);font-size:13px;font-weight:700;margin:12px 0 8px}
.dash-qa-pick-list{display:flex;flex-direction:column;gap:8px}
.dash-qa-pick{
  display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  padding:10px 12px;border-radius:var(--rmd);border:1px solid var(--ls3);
  background:var(--ls2);cursor:pointer;font-family:var(--fd);font-size:14px;font-weight:600;color:var(--ltp);
}
.dash-qa-pick:hover{border-color:var(--l500);background:var(--l100)}
.dash-qa-pick .dash-quick-ico{width:36px;height:36px;flex-shrink:0}
.dash-qa-pick .qa-member,.dash-quick-ico.qa-member{background:var(--inf100);color:var(--inf500)}
.dash-qa-pick .qa-checkin,.dash-quick-ico.qa-checkin{background:var(--l100);color:var(--l600)}
.dash-qa-pick .qa-sale,.dash-quick-ico.qa-sale{background:var(--suc100);color:var(--suc500)}
.dash-qa-pick .qa-collect,.dash-quick-ico.qa-collect{background:var(--wrn100);color:var(--wrn500)}
.dash-qa-pick .qa-trial,.dash-quick-ico.qa-trial{background:var(--l100);color:var(--l600)}
.dash-qa-pick .qa-remind,.dash-quick-ico.qa-remind{background:var(--wrn100);color:var(--wrn500)}
.dash-qa-pick .qa-shift,.dash-quick-ico.qa-shift{background:var(--inf100);color:var(--inf500)}
.dash-qa-pick .qa-close,.dash-quick-ico.qa-close{background:var(--dng100);color:var(--dng500)}
.dash-qa-pick .qa-refund,.dash-quick-ico.qa-refund{background:var(--dng100);color:var(--dng500)}
.dash-qa-pick .qa-offer,.dash-quick-ico.qa-offer{background:var(--suc100);color:var(--suc500)}
.dash-qa-pick .qa-freeze,.dash-quick-ico.qa-freeze{background:var(--inf100);color:var(--inf500)}
.dash-qa-pick .qa-class,.dash-quick-ico.qa-class{background:var(--l100);color:var(--l600)}
.dash-qa-rows{list-style:none;display:flex;flex-direction:column;gap:8px}
.dash-qa-row{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ls3);
  border-radius:var(--rmd);background:var(--ls2);
}
.dash-qa-row-label{flex:1;font-family:var(--fd);font-size:14px;font-weight:600}
.dash-qa-row-actions{display:flex;gap:4px;flex-shrink:0}
.dash-qa-row-actions .dash-btn{padding:6px 8px}
.dash-toast{
  position:fixed;bottom:24px;inset-inline-end:24px;z-index:500;display:none;
  padding:10px 16px;border-radius:var(--rmd);font-size:13px;font-weight:600;
  box-shadow:var(--sh2);max-width:min(420px,calc(100vw - 32px));
}
.dash-toast.show{display:block}
.dash-toast.ok{background:var(--suc100);color:var(--suc500)}
.dash-toast.err{background:var(--dng100);color:var(--dng500)}
.dash-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.dash-breakdown>div{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--ls3);border-radius:var(--rsm);font-size:12px}
.dash-breakdown strong{font-family:var(--fd)}
.dash-attention-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.dash-attention-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--ls3);border-radius:var(--rsm);color:inherit;text-decoration:none}
.dash-attention-item:hover{border-color:var(--l500);background:var(--l100)}
.dash-attention-item>.ti{font-size:19px;color:var(--wrn500);flex-shrink:0}
.dash-attention-item span{flex:1;font-size:13px}
.dash-attention-item strong{font-family:var(--fd);font-size:13px}
.dash-empty{display:flex;align-items:center;gap:9px;color:var(--ltt);padding:12px 0}
.dash-empty .ti{font-size:20px;color:var(--suc500)}
.dash-alert-list{display:flex;flex-direction:column;gap:8px}
.dash-alert{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--rmd);
  border:1px solid var(--ls3);background:var(--ls2);text-decoration:none;color:var(--ltp);
  transition:border-color var(--tf),background var(--tf);
}
.dash-alert:hover{border-color:var(--l500);background:var(--l100)}
.dash-alert > .ti:first-child{font-size:20px;color:var(--wrn500);flex-shrink:0}
.dash-alert-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dash-alert-body strong{font-family:var(--fd);font-size:13px}
.dash-alert-body span{font-size:12px;color:var(--ltt)}
.dash-alert-chev{color:var(--ltt);font-size:16px;flex-shrink:0}
[dir="rtl"] .dash-alert-chev{transform:scaleX(-1)}
.dash-glance{display:flex;flex-wrap:wrap;gap:8px}
.dash-glance-chip{
  display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--rpl);
  background:var(--ls2);border:1px solid var(--ls3);font-size:12px;font-weight:600;color:var(--lts);
}
.dash-chart-wrap{position:relative;height:140px;margin-top:10px}
.dash-chart-skel{display:flex;align-items:flex-end;gap:8px;height:100%;padding:8px 4px 4px}
.dash-skel-bar{
  flex:1;border-radius:6px 6px 2px 2px;
  background:linear-gradient(90deg,var(--ls3) 25%,var(--ls2) 50%,var(--ls3) 75%);
  background-size:200% 100%;animation:dash-skel 1.1s linear infinite;
}
@keyframes dash-skel{to{background-position:-200% 0}}
.dash-chart-empty{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:12px}
.dash-chart-hdr{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--fd);font-size:13px;font-weight:700}
#financePeriodSeg{max-width:100%;overflow-x:auto}
.dash-seg{display:inline-flex;border:1px solid var(--ls3);border-radius:var(--rmd);overflow:hidden;margin-inline-start:auto}
.dash-seg-btn{border:none;background:var(--ls2);padding:4px 10px;font-family:var(--fd);font-size:12px;font-weight:700;cursor:pointer;color:var(--lts)}
.dash-seg-btn.act{background:var(--l500);color:var(--c900)}
.dash-custom-range{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.dash-custom-range input{max-width:145px;border:1px solid var(--ls3);border-radius:var(--rsm);padding:7px 8px;background:var(--ls1);color:var(--ltp)}
.dash-local-err{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.dash-local-err p{color:var(--ltt);font-size:13px}
.occ-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.occ-gauge{position:relative;width:120px;height:120px;flex-shrink:0}
.occ-gauge svg{display:block;width:120px;height:120px;transform:rotate(-90deg)}
.occ-gauge .track{fill:none;stroke:var(--ls3);stroke-width:10}
.occ-gauge .fill{fill:none;stroke:var(--suc500);stroke-width:10;stroke-linecap:round;stroke-dasharray:301.593;stroke-dashoffset:301.593}
.occ-gauge.ok .fill{stroke:var(--suc500)}
.occ-gauge.busy .fill{stroke:var(--wrn500)}
.occ-gauge.full .fill,.occ-gauge.over .fill{stroke:var(--dng500)}
.occ-gauge.mute .fill{stroke:var(--ls3)}
.occ-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.occ-pct{font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.occ-pct small{font-size:13px;font-weight:600;color:var(--ltt)}
.occ-pct-lbl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ltt);margin-top:2px}
.occ-copy{flex:1;min-width:140px}
.occ-status{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.occ-status strong{font-family:var(--fd);font-size:16px;font-weight:700}
.occ-dot{width:10px;height:10px;border-radius:50%;background:var(--suc500);box-shadow:0 0 0 4px var(--suc100);flex-shrink:0}
.occ-dot.busy{background:var(--wrn500);box-shadow:0 0 0 4px var(--wrn100)}
.occ-dot.full,.occ-dot.over{background:var(--dng500);box-shadow:0 0 0 4px var(--dng100)}
.occ-dot.mute{background:var(--ltt);box-shadow:0 0 0 4px var(--ls3)}
.occ-bar{height:8px;background:var(--ls2);border-radius:999px;overflow:hidden;margin-top:10px}
.occ-bar > i{display:block;height:100%;border-radius:999px;background:var(--suc500)}
.occ-bar.busy > i{background:var(--wrn500)}
.occ-bar.full > i,.occ-bar.over > i{background:var(--dng500)}

@media(max-width:900px){
  .dash-widget,.dash-widget.span-6,.dash-widget.span-12{grid-column:span 12}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}[dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}[dir="rtl"] .main{margin-right:0}
  .content{padding:16px}.topbar{padding:0 16px}
  .dash-intro{align-items:flex-start;flex-direction:column;gap:8px}
  .dash-intro h1{font-size:23px}
  .mob-toggle{display:flex!important}
  .dash-quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-chart-hdr #financePeriodSeg{width:100%;margin-inline-start:0}
}
.mob-toggle{display:none!important;width:36px;height:36px;align-items:center;justify-content:center;border:none;background:var(--ls2);border-radius:var(--rmd);cursor:pointer;font-size:18px;color:var(--lts)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-hdr">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7ACC00"/><path d="M10 22L16 10L22 22" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 18H20" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/></svg>
      <span>GymFlowPro</span>
    </div>
    <nav class="sb-nav">
      <!-- Replaced at runtime by GfpShell from useVisibleNav() -->
      <a class="sb-item act" href="/dashboard/"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
    </nav>
    <div class="sb-ft">
      <div class="av-sm" id="userAvatar">—</div>
      <div class="sb-ft-info">
        <div class="sb-ft-name" id="userName">User</div>
        <div class="sb-ft-role" id="userRole">Staff</div>
      </div>
      <button class="sb-logout" id="btnLogout" title="Logout"><i class="ti ti-logout"></i></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <button class="mob-toggle" id="mobToggle" type="button"><i class="ti ti-menu-2"></i></button>
        <div class="tb-breadcrumb">Dashboard</div>
      </div>
      <div class="tb-right">
        <div>
          <div class="tb-gym-name" id="gymName">GymFlowPro</div>
          <div class="tb-gym-name-ar" id="gymNameAr"></div>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="dash-intro">
        <div>
          <div class="dash-eyebrow">Gym operations</div>
          <h1 id="dashboardHeadline">Your gym dashboard</h1>
          <p id="dashboardSubtitle">What is happening in your gym today, and what needs attention?</p>
        </div>
        <span class="dash-intro-meta">Live data · Cairo calendar day</span>
      </div>
      <div class="widget-grid" id="widgetGrid" aria-live="polite">
        <div class="dash-widget" style="grid-column:span 12"><div class="dash-muted">Loading widgets…</div></div>
      </div>
    </div>
  </div>
</div>

<script src="/shared/quick-actions.js?v=5"></script>
<script src="/dashboard/dashboard-home.js?v=owner-glossary1"></script>
