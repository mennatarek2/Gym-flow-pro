<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GymFlowPro — Classes</title>
<meta name="description" content="Front-desk class sessions and bookings.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="classes.css?v=flow12">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sb-hdr"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7ACC00"/><path d="M10 22L16 10L22 22" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 18H20" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/></svg><span>GymFlowPro</span></div>
<nav class="sb-nav"><a class="sb-item" href="/dashboard/"><i class="ti ti-layout-dashboard"></i>Dashboard</a></nav>
<div class="sb-ft"><div class="av-sm" id="userAvatar">U</div><div class="sb-ft-info"><div class="sb-ft-name" id="userName">User</div><div class="sb-ft-role" id="userRole">Staff</div></div><button class="sb-logout" id="btnLogout" title="Logout"><i class="ti ti-logout"></i></button></div>
</aside>
<div class="main">
<header class="topbar">
  <div class="tb-left"><div class="tb-breadcrumb"><span>Front desk</span><span class="sep">/</span><span class="current">Classes</span></div></div>
  <div class="tb-right"><div class="gym-name" id="gymName">Gym</div><div class="gym-name-ar" id="gymNameAr"></div></div>
</header>
<div class="content">
  <div class="page-header">
    <div class="ph-left">
      <h1 class="page-title">Classes <span class="title-ar">/ الحصص</span></h1>
      <p class="page-subtitle">What classes are happening — activity, time, coach, and capacity</p>
    </div>
    <div class="ph-right day-controls">
      <div class="day-chips" role="group" aria-label="Quick dates">
        <button type="button" class="day-chip is-active" id="chipToday" data-range="today">Today</button>
        <button type="button" class="day-chip" id="chipTomorrow" data-range="tomorrow">Tomorrow</button>
        <button type="button" class="day-chip" id="chipWeek" data-range="week">This week</button>
      </div>
      <div class="date-nav" role="group" aria-label="Date navigation">
        <button type="button" class="date-btn" id="btnPrev" aria-label="Previous day"><i class="ti ti-chevron-left"></i></button>
        <button type="button" class="date-display" id="dateDisplay" aria-live="polite"></button>
        <input type="date" id="datePick" class="date-pick" aria-label="Pick date">
        <button type="button" class="date-btn" id="btnNext" aria-label="Next day"><i class="ti ti-chevron-right"></i></button>
        <button type="button" class="btn-today" id="btnToday">Today</button>
        <button type="button" class="btn-refresh" id="btnRefresh" aria-label="Refresh"><i class="ti ti-refresh"></i></button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <label class="filter-field">
      <span class="filter-label">Activity</span>
      <select id="activityFilter" class="filter-select" aria-label="Filter by activity">
        <option value="">All Activities</option>
      </select>
    </label>
    <div class="stats-bar" aria-live="polite">
      <div class="stat-pill"><i class="ti ti-calendar-event"></i><span id="statSessions">0</span> Sessions</div>
      <div class="stat-pill"><i class="ti ti-users"></i><span id="statBooked">0</span> Booked</div>
      <div class="stat-pill active"><i class="ti ti-check"></i><span id="statCheckedIn">0</span> Checked in</div>
    </div>
  </div>

  <div class="sessions-list" id="sessionsList"></div>
  <div id="facilitiesSection" hidden></div>
</div>
</div>
</div>
<div class="modal-overlay drawer-overlay" id="drawerOverlay"><div class="drawer" id="drawerContent"></div></div>
<div class="modal-overlay" id="bookOverlay"><div class="modal book-modal" id="bookContent"></div></div>
<div class="modal-overlay" id="classPrintOverlay">
  <div class="class-print-box" role="dialog" aria-modal="true" aria-labelledby="classPrintTitle">
    <div class="class-print-hdr">
      <h3 id="classPrintTitle">Invoice</h3>
      <button type="button" class="drawer-close" id="classPrintClose" aria-label="Close"><i class="ti ti-x"></i></button>
    </div>
    <iframe id="classPrintFrame" title="Class booking invoice"></iframe>
    <div class="class-print-actions">
      <button type="button" class="btn-book" id="classPrintDo"><i class="ti ti-printer"></i> Print</button>
      <button type="button" class="btn-cancel" id="classPrintDismiss">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="classes-app.js?v=flow12"></script>
</body>
</html>
