<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GymFlowPro — Stock counts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="counts.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sb-hdr"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7ACC00"/><path d="M10 22L16 10L22 22" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 18H20" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/></svg><span>GymFlowPro</span></div>
<nav class="sb-nav"><a class="sb-item" href="/dashboard/"><i class="ti ti-layout-dashboard"></i>Dashboard</a></nav>
<div class="sb-ft"><div class="av-sm" id="userAvatar">—</div><div class="sb-ft-info"><div class="sb-ft-name" id="userName">User</div><div class="sb-ft-role" id="userRole">Staff</div></div><button class="sb-logout" id="btnLogout"><i class="ti ti-logout"></i></button></div>
</aside>
<div class="main">
<header class="topbar">
  <div class="tb-left"><div class="tb-breadcrumb"><span data-en="Inventory" data-ar="المخزون">Inventory</span><span class="sep">/</span><span class="current" data-en="Count" data-ar="جرد">Count</span></div></div>
  <div class="tb-right"><div class="gym-name" id="gymName">GymFlowPro</div><div class="gym-name-ar" id="gymNameAr"></div></div>
</header>
<div class="content">
  <div class="page-header">
    <div>
      <h1 class="page-title" data-en="Stock counts" data-ar="جرد المخزون">Stock counts</h1>
      <p class="page-subtitle" data-en="Freeze on-hand qty, count shelves, submit, then approve to post differences." data-ar="ثبّت الرصيد في النظام، عُدّ الرف، قدّم، ثم وافق لتسجيل الفرق.">Freeze on-hand qty, count shelves, submit, then approve to post differences.</p>
    </div>
    <div>
      <button type="button" class="btn-create" id="btnCreate"><i class="ti ti-plus"></i> <span data-en="New count" data-ar="جرد جديد" data-i18n-text>New count</span></button>
    </div>
  </div>
  <div class="layout-split">
    <div>
      <div class="toolbar">
        <label><span data-en="Status" data-ar="الحالة">Status</span>
          <select id="filterStatus">
            <option value="" data-en="All" data-ar="الكل">All</option>
            <option value="draft">draft</option>
            <option value="submitted">submitted</option>
            <option value="approved">approved</option>
            <option value="cancelled">cancelled</option>
          </select>
        </label>
        <button type="button" class="btn-secondary" id="btnRefresh"><i class="ti ti-refresh"></i></button>
      </div>
      <div class="table-wrap" id="tableHost"><div class="loading-state"><div class="loader"></div><p data-en="Loading…" data-ar="جاري التحميل…">Loading…</p></div></div>
    </div>
    <div class="detail-card" id="detailHost"><p class="muted" data-en="Select a count." data-ar="اختار جرداً.">Select a count.</p></div>
  </div>
</div>
</div>
</div>

<div class="modal-overlay" id="ctModal" hidden>
  <div class="modal">
    <div class="modal-hdr">
      <h2 data-en="New stock count" data-ar="جرد جديد">New stock count</h2>
      <button type="button" class="modal-close" data-close="ctModal"><i class="ti ti-x"></i></button>
    </div>
    <form id="ctForm" class="modal-body">
      <label><span data-en="Warehouse *" data-ar="المستودع *">Warehouse *</span>
        <select id="ctWarehouse" required><option value="">…</option></select>
      </label>
      <label><span data-en="Note" data-ar="ملاحظة">Note</span><textarea id="ctNote" rows="2" maxlength="500"></textarea></label>
      <p class="muted" data-en="Creates a snapshot of on-hand qty for all trackable products in the warehouse." data-ar="ينشئ لقطة من الرصيد لكل المنتجات المتتبعة في المستودع.">Creates a snapshot of on-hand qty for all trackable products in the warehouse.</p>
      <p class="form-hint" id="ctHint"></p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close="ctModal" data-en="Cancel" data-ar="إلغاء">Cancel</button>
        <button type="submit" class="btn-create" data-en="Create draft" data-ar="إنشاء مسودة">Create draft</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="counts-app.js"></script>
</body>
</html>
